name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest

    # No database service here, unlike analysis-engine's CI. This suite is
    # entirely unit-level: the repositories are exercised against fakes and
    # the agents against a stub LLM, so it runs in well under a second and
    # needs nothing to be standing up.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  image:
    name: Docker build
    runs-on: ubuntu-latest

    # The image is what actually gets deployed, and it is easy to break it
    # without breaking the tests — a file left out of the COPY, a
    # dependency only present in a local virtualenv. Building it here
    # catches that on the branch rather than on the host.
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t technical-debt-service:ci .
